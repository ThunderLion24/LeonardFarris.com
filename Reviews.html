<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ReviewsSS.css">
    <title>Reviews | Leonard Farris</title>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Leave a <span>Review</span></h1>
            <p class="subtitle">Share your thoughts — I'd love to hear from you</p>
            <a class="review-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeJMVVMT9PON-NM4TyTQ3UxHVa7710G9TkLTvO3vIDWZe_FeA/viewform?usp=publish-editor" target="_blank">Leave a Review</a>
        </div>
    </div>

    <nav class="home-bar">
        <div class="home-links">
            <a href="index.html" data-nav="about">About Me</a>
            <a href="Hobbies.html" data-nav="hobbies">Hobbies</a>
            <a href="calculator.html" data-nav="calc">Calculator</a>
            <a class="current" href="Reviews.html" data-nav="reviews">Reviews</a>
            <a href="papers.html" data-nav="papers">Papers</a>
            <a href="CAISE.html" data-nav="caise">CAISE</a>
        </div>
        <select id="lang-select" onchange="setLanguage(this.value)">
            <option value="en">🌐 English</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="ja">🇯🇵 日本語</option>
        </select>
    </nav>

    <div class="container">


        <div class="form-wrapper">
            <iframe
                id="review-form"
                src="https://docs.google.com/forms/d/e/1FAIpQLSeJMVVMT9PON-NM4TyTQ3UxHVa7710G9TkLTvO3vIDWZe_FeA/viewform?usp=publish-editor"
                height="600"
                frameborder="0"
                marginheight="0"
                marginwidth="0">
                Loading form…
            </iframe>
        </div>

        <div class="divider"></div>

        <h2 class="section-title">What People <span>Say</span></h2>
        <p class="section-subtitle">Reviews update automatically every 2 minutes</p>

        <div id="reviews-container" class="reviews-grid">
            <p class="status-msg">Loading reviews…</p>
        </div>

        <p class="refresh-note" id="last-updated"></p>

        <footer>
            &copy; 2026 Leonard Farris &mdash; CLIP Oporto International School
        </footer>
    </div>

<script>
    const translations = {
        en: {
            heading: `Leave a <span>Review</span>`,
            subtitle: "Share your thoughts — I'd love to hear from you",
            reviewLink: "Leave a Review",
            sectionTitle: `What People <span>Say</span>`,
            sectionSubtitle: "Reviews update automatically every 2 minutes",
            loading: "Loading reviews…",
            noReviews: "No reviews yet — be the first!",
            lastUpdated: "Last updated: ",
            loadError: "Could not load reviews. Check your CSV URL."
        },
        pt: {
            heading: `Deixar uma <span>Avaliação</span>`,
            subtitle: "Partilhe a sua opinião — adorava ouvir de si",
            reviewLink: "Deixar uma Avaliação",
            sectionTitle: `O Que as Pessoas <span>Dizem</span>`,
            sectionSubtitle: "As avaliações atualizam automaticamente a cada 2 minutos",
            loading: "A carregar avaliações…",
            noReviews: "Sem avaliações ainda — seja o primeiro!",
            lastUpdated: "Última atualização: ",
            loadError: "Não foi possível carregar as avaliações."
        },
        de: {
            heading: `Eine <span>Bewertung</span> hinterlassen`,
            subtitle: "Teile deine Gedanken — ich würde gerne von dir hören",
            reviewLink: "Bewertung hinterlassen",
            sectionTitle: `Was die Leute <span>sagen</span>`,
            sectionSubtitle: "Bewertungen werden automatisch alle 2 Minuten aktualisiert",
            loading: "Bewertungen werden geladen…",
            noReviews: "Noch keine Bewertungen — sei der Erste!",
            lastUpdated: "Zuletzt aktualisiert: ",
            loadError: "Bewertungen konnten nicht geladen werden."
        },
        es: {
            heading: `Dejar una <span>Reseña</span>`,
            subtitle: "Comparte tus pensamientos — me encantaría saber de ti",
            reviewLink: "Dejar una Reseña",
            sectionTitle: `Lo que la Gente <span>Dice</span>`,
            sectionSubtitle: "Las reseñas se actualizan automáticamente cada 2 minutos",
            loading: "Cargando reseñas…",
            noReviews: "Sin reseñas aún — ¡sé el primero!",
            lastUpdated: "Última actualización: ",
            loadError: "No se pudieron cargar las reseñas."
        },
        fr: {
            heading: `Laisser un <span>Avis</span>`,
            subtitle: "Partagez vos pensées — j'adorerais avoir de vos nouvelles",
            reviewLink: "Laisser un Avis",
            sectionTitle: `Ce que les gens <span>disent</span>`,
            sectionSubtitle: "Les avis se mettent à jour automatiquement toutes les 2 minutes",
            loading: "Chargement des avis…",
            noReviews: "Aucun avis pour l'instant — soyez le premier !",
            lastUpdated: "Dernière mise à jour : ",
            loadError: "Impossible de charger les avis."
        },
        ru: {
            heading: `Оставить <span>Отзыв</span>`,
            subtitle: "Поделитесь своими мыслями — я рад вас услышать",
            reviewLink: "Оставить отзыв",
            sectionTitle: `Что говорят <span>люди</span>`,
            sectionSubtitle: "Отзывы обновляются автоматически каждые 2 минуты",
            loading: "Загрузка отзывов…",
            noReviews: "Отзывов пока нет — будьте первым!",
            lastUpdated: "Последнее обновление: ",
            loadError: "Не удалось загрузить отзывы."
        },
        ja: {
            heading: `<span>レビュー</span>を残す`,
            subtitle: "あなたの考えを共有してください — ぜひ聞かせてください",
            reviewLink: "レビューを残す",
            sectionTitle: `みんなの<span>声</span>`,
            sectionSubtitle: "レビューは2分ごとに自動更新されます",
            loading: "レビューを読み込み中…",
            noReviews: "まだレビューがありません — 最初のレビューを書いてみましょう！",
            lastUpdated: "最終更新: ",
            loadError: "レビューを読み込めませんでした。"
        }
    };

    let currentLang = 'en';

    function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        document.querySelector('h1').innerHTML = t.heading;
        document.querySelector('.subtitle').textContent = t.subtitle;
        document.querySelector('.review-link').textContent = t.reviewLink;
        document.querySelector('.section-title').innerHTML = t.sectionTitle;
        document.querySelector('.section-subtitle').textContent = t.sectionSubtitle;
        localStorage.setItem('lang', lang);
        document.documentElement.lang = lang;
    }

    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT0TOhSKfMxHA_BhsqXrO2fM4e0HcTVAy5RoHH1Rr3vZ6oaXYHvUUqMMlmX5Iup2UMCZAG0TmTdakok/pub?output=csv&gid=669190595';

    const COL_TIMESTAMP = 0;
    const COL_NAME      = 1;
    const COL_RATING    = 2;
    const COL_REVIEW    = 3;

    function parseCSV(text) {
        const rows = [];
        const lines = text.trim().split('\n');
        for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].match(/(".*?"|[^,]+)(?=,|$)/g) || [];
            rows.push(cols.map(c => c.replace(/^"|"$/g, '').trim()));
        }
        return rows;
    }

    function starsHTML(rating) {
        const n = Math.min(5, Math.max(1, parseInt(rating) || 0));
        return '★'.repeat(n) + '☆'.repeat(5 - n);
    }

    function renderReviews(rows) {
        const container = document.getElementById('reviews-container');
        const t = translations[currentLang];
        if (!rows.length) {
            container.innerHTML = `<p class="status-msg">${t.noReviews}</p>`;
            return;
        }
        container.innerHTML = rows.slice().reverse().map(row => `
            <div class="review-card">
                <div class="review-header">
                    <span class="review-name">${escapeHTML(row[COL_NAME] || 'Anonymous')}</span>
                    <span class="review-stars">${starsHTML(row[COL_RATING])}</span>
                </div>
                <p class="review-text">${escapeHTML(row[COL_REVIEW] || '')}</p>
                <p class="review-date">${escapeHTML(row[COL_TIMESTAMP] || '')}</p>
            </div>
        `).join('');
    }

    function escapeHTML(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    async function fetchReviews() {
        const t = translations[currentLang];
        try {
            const res = await fetch(CSV_URL + '&cachebust=' + Date.now());
            const text = await res.text();
            renderReviews(parseCSV(text));
            document.getElementById('last-updated').textContent =
                t.lastUpdated + new Date().toLocaleTimeString();
        } catch {
            document.getElementById('reviews-container').innerHTML =
                `<p class="status-msg">${t.loadError}</p>`;
        }
    }

    const savedLang = localStorage.getItem('lang');
    if (savedLang && translations[savedLang]) {
        document.getElementById('lang-select').value = savedLang;
        setLanguage(savedLang);
    }

    fetchReviews();
    setInterval(fetchReviews, 2 * 60 * 1000);
</script>
<script src="homebar.js"></script>
</body>
</html>

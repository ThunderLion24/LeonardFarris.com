<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CAISEPagesSS.css">
    <title> CAISE Creativity | LeonardFarris.com </title>
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1>Creativity</h1>
            <p class="subtitle"></p>
        </header>
    </div>

    <nav class="home-bar">
        <div class="home-links">
            <a href="index.html" data-nav="about">About Me</a>
            <a href="Hobbies.html" data-nav="hobbies">Hobbies</a>
            <a href="calculator.html" data-nav="calc">Calculator</a>
            <a href="Reviews.html" data-nav="reviews">Reviews</a>
            <a href="papers.html" data-nav="papers">Papers</a>
            <a class="current" href="CAISE.html" data-nav="caise">CAISE</a>
        </div>
        <select id="lang-select">
            <option value="en">🌐 English</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="es">🇪🇸 Español</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="ja">🇯🇵 日本語</option>
        </select>
    </nav>

    <div class="container">
        <a class="back-link" href="CAISE.html">&#8592; Back to CAISE</a>
        <a class="jump-link" href="#time-log">Jump to time log &#8595;</a>

        <div class="divider"></div>

        <table class="t-chart" id="time-log">
            <thead>
                <tr>
                    <th>Creativity</th>
                    <th>Time spent</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><a href="https://thunderlion24.github.io/Hackathon">Hackathon</a></td>
                    <td>Unknown</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th>Total</th>
                    <th id="time-total">0/30 hours</th>
                </tr>
            </tfoot>
        </table>
    </div>
<script src="homebar.js"></script>
<script>
    // Time log total: adds up the hours in each row's second column.
    // Cells without a number (like "Unknown") count as 0.
    (function () {
        const goal = 30;
        let hours = 0;
        document.querySelectorAll('#time-log tbody tr').forEach(row => {
            hours += parseFloat(row.cells[1].textContent) || 0;
        });
        document.getElementById('time-total').textContent = hours + '/' + goal + ' hours';
    })();
</script>
</body>
</html>
